<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="340" height="80" role="img" aria-label="kbots logo">
  <!-- Badge mark in the arvidsson.tech favicon style: dark plate, red bar, mono wordmark -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="340" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a0a0f"/>
      <stop offset="1" stop-color="#12121a"/>
    </linearGradient>
  </defs>
  <rect x="2" y="6" width="336" height="68" rx="12" fill="url(#plate)"/>
  <rect x="18" y="20" width="3" height="40" fill="#ff4444"/>
  <!-- mini mascot face -->
  <rect x="38" y="24" width="52" height="32" rx="9" fill="none" stroke="#7d8695" stroke-width="3.5"/>
  <ellipse cx="56" cy="40" rx="4" ry="6" fill="#ff4444"/>
  <ellipse cx="72" cy="40" rx="4" ry="6" fill="#ff6b6b"/>
  <!-- wordmark -->
  <text x="108" y="52" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="34" font-weight="700" letter-spacing="1"><tspan fill="#ff4444">k</tspan><tspan fill="#FFFFFF">bots</tspan></text>
</svg>
