# Brand configuration for the design tools (render_html, html_to_pdf,
# render_diagram, create_slides). This is the built-in kbots placeholder
# brand — everything works and looks designed out of the box.
#
# To rebrand a deployment: copy this file to <overlay>/config/brand.yaml,
# adjust the values, and drop your logo next to it (overlay config wins
# over this file). Colors are hex; font_family is a CSS font stack;
# font_url is an optional webfont stylesheet loaded when rendering
# (output falls back to the system stack when offline).

name: kbots
tagline: Self-contained agents, real work
logo: config/assets/kbots-logo.svg

colors:
  primary: "#ff4444"     # red — headings, links, accents (arvidsson.tech)
  secondary: "#334155"   # slate — secondary text, borders
  accent: "#ff6b6b"      # light red — highlights, callouts
  background: "#FAFAFA"  # page background
  surface: "#FFFFFF"     # cards, tables
  text: "#1E293B"        # body text
  muted: "#64748B"       # captions, footers

font_family: "Inter, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif"
font_url: "https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"

footer_text: Generated by kbots
