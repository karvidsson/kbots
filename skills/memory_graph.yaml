name: memory_graph
description: Generate and send an interactive map of the agent's memory graph (entities + relationships)
tools:
  - memory_graph
  - send_discord_file
prompt: |
  The user wants to see the memory graph.

  1. Call `memory_graph` — it gathers every entity and relationship visible to
     you from graph memory and writes a self-contained interactive HTML file,
     returning its path.
  2. Send that file to the user in THIS channel with
     `send_discord_file(channel_id=<this channel>, file_path=<the path from step 1>)`,
     plus a short note like "Here's the current memory graph — open it in a
     browser and click any entity to see its relationships."

  The HTML file is the deliverable — don't try to describe the whole graph in
  text. If the tool says the graph is empty or not enabled, relay that message
  instead.
