name: memory_graph
description: Generate and send an interactive map of this agent's memory graph (entities + relationships)
tools:
  - memory_graph
  - send_discord_file
prompt: |
  The user wants to see the memory graph.

  1. Call `memory_graph` — it gathers YOUR memories (entities + relationships
     this agent stored) from graph memory and writes an interactive HTML file
     (D3 force graph — zoom, drag, search, click-to-inspect), returning its path.
     Pass view='shared' only if the user asked for the shared/global graph, and
     view='all' only if they asked for the whole fleet's graph (every agent's
     edges, colour-coded by owner — works only for coordinator/privileged
     agents; if the tool refuses, relay its message).
  2. Send that file to the user in THIS channel with
     `send_discord_file(channel_id=<this channel>, file_path=<the path from step 1>)`,
     plus a short note like "Here's the current memory graph — open it in a
     browser: drag/zoom the map, hover to highlight neighbours, click an entity
     to see its relationships, or search by name."

  The HTML file is the deliverable — don't try to describe the whole graph in
  text. If the tool says the graph is empty or not enabled, relay that message
  instead.
